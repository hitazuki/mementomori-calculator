name: Sync Image Assets

on:
  schedule:
    - cron: '20 8 * * *' # 北京时间每天 16:20，补查延迟上线的图片
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_deploy:
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-assets:
    outputs:
      changes: ${{ steps.git-check.outputs.changes }}
    concurrency:
      group: image-sync-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: 'mmt-calculator'
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync image assets
        working-directory: mmt-calculator
        run: |
          npm ci
          npm run sync:assets

      - name: Sync raid skill icons
        working-directory: mmt-calculator
        run: npm run sync:raid-icons

      - name: Check for changes
        id: git-check
        working-directory: mmt-calculator
        run: |
          git add public/images/jobs/ public/images/characters/ public/images/character-thumbnails/ public/images/skills/ src/constants/raid/skillIcons.js
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No image asset changes detected."
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Image asset changes detected."
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        working-directory: mmt-calculator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(assets): auto sync image assets"
          git push

  deploy:
    needs: sync-assets
    if: needs.sync-assets.outputs.changes == 'true' && inputs.skip_deploy != true
    uses: ./.github/workflows/deploy.yml
