name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_call:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Record publication source
        id: source
        env:
          PUBLICATION_KEY: published-v1-${{ github.ref_name }}-${{ hashFiles('public/data/**', 'public/images/**', 'src/constants/raid/skillIcons.js') }}
        run: echo "publication-key=$PUBLICATION_KEY" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Validate commit messages
        run: node scripts/check_commit_range.mjs
      - name: Install dependencies
        run: npm ci
      - name: Ensure raid skill icons
        run: npm run sync:raid-icons
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write successful publication marker
        run: echo published > .master-published
      - name: Save successful publication marker
        uses: actions/cache/save@v4
        with:
          path: .master-published
          key: ${{ steps.source.outputs.publication-key }}
